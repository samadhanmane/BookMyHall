<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>MITAOE Campus Resource Management | MIT Academy of Engineering</title>
    <meta name="title" content="MITAOE Campus Resource Management | MIT Academy of Engineering" />
    <meta name="description" content="AI-powered campus facility booking, canteen management, maintenance workflows, and analytics platform for MIT Academy of Engineering, Pune." />
    <meta name="keywords" content="MITAOE, MIT Academy of Engineering, campus resource management, facility booking, seminar hall booking, campus management system, ERP, Pune college" />
    <meta name="author" content="MIT Academy of Engineering" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#123458" />

    <!--
      Canonical URL, og:url, og:image, twitter:url and twitter:image are intentionally
      omitted here. They are injected dynamically per-page by the useSEO hook
      which reads VITE_APP_BASE_URL from the environment (see src/config/seo.ts).
      Set VITE_APP_BASE_URL in .env once you have a production domain.
    -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Open Graph base tags (URLs injected at runtime by useSEO hook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MITAOE Campus Resource Management" />
    <meta property="og:title" content="MITAOE Campus Resource Management | MIT Academy of Engineering" />
    <meta property="og:description" content="AI-powered campus facility booking, canteen management, maintenance workflows, and analytics platform for MIT Academy of Engineering, Pune." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MITAOE Campus Resource Management System" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card base tags (URLs injected at runtime by useSEO hook) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MITAOE Campus Resource Management | MIT Academy of Engineering" />
    <meta name="twitter:description" content="AI-powered campus facility booking, canteen management, maintenance workflows, and analytics platform for MIT Academy of Engineering, Pune." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
